name: Build 8-Ball APK

on:
  push:
    paths:
      - 'pool/**'
      - 'pool-android/**'
      - '.github/workflows/pool-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle -p pool-android assembleDebug --no-daemon
      - name: Rename APK
        run: cp pool-android/app/build/outputs/apk/debug/app-debug.apk clubhouse-8ball.apk
      - uses: actions/upload-artifact@v4
        with:
          name: clubhouse-8ball-apk
          path: clubhouse-8ball.apk
      - name: Publish to the "8ball-latest" release (direct phone download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 8ball-latest
          name: Clubhouse 8-Ball (latest build)
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: clubhouse-8ball.apk
          body: Ad-free offline 8-ball. Download clubhouse-8ball.apk on your Android phone and open it to install.

      # Signed Play Store bundle: runs only once the signing secrets exist (see pool/README.md)
      - name: Build signed Play Store bundle (.aab)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No signing secrets set; skipping the Play Store bundle."; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          gradle -p pool-android bundleRelease --no-daemon
          cp pool-android/app/build/outputs/bundle/release/app-release.aab clubhouse-8ball.aab
      - uses: actions/upload-artifact@v4
        with:
          name: clubhouse-8ball-playstore-bundle
          path: clubhouse-8ball.aab
          if-no-files-found: ignore
